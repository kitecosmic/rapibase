# Docker Compose for RapiBase with external PostgreSQL
# Use this when you already have a PostgreSQL database (Coolify, Railway, Supabase, etc.)
#
# Usage:
#   1. Copy .env.example to .env and configure your DATABASE_URL
#   2. Run: docker compose -f docker-compose.standalone.yaml up -d

services:
  rapibase:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Database (REQUIRED - point to your external PostgreSQL)
      - DATABASE_URL=${DATABASE_URL}
      
      # Server
      - PORT=8080
      - HOST=0.0.0.0
      - APP_URL=${APP_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      
      # Auth
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRY=${JWT_EXPIRY:-1h}
      - REFRESH_EXPIRY=${REFRESH_EXPIRY:-7d}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rapibase.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      
      # API Keys
      - ANON_KEY=${ANON_KEY:-}
      - SERVICE_KEY=${SERVICE_KEY:-}
      
      # SMTP (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-RapiBase}
      
      # Auth Redirect
      - AUTH_REDIRECT_URL=${AUTH_REDIRECT_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
