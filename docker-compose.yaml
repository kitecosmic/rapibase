# =============================================================================
# RAPIBASE - Docker Compose Configuration
# =============================================================================
# Quick start: docker compose up -d
# Access: http://localhost:8080 (or your server IP)
# =============================================================================

services:
  rapibase:
    build: .
    # Ports are bound to 127.0.0.1 so ONLY a reverse proxy on the host
    # (Caddy/nginx) can reach them — never the public internet directly.
    # Exposing 8080 to 0.0.0.0 is how an attacker can bypass Caddy and
    # hit the API with no TLS/WAF. If your Caddy runs inside Docker,
    # remove this published port and reach rapibase by its service name.
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      # Database (uses 'db' service by default, override with DATABASE_URL env var)
      - DATABASE_URL=${DATABASE_URL:-postgres://rapibase:rapibase@db:5432/rapibase?sslmode=disable}
      
      # Server
      - PORT=8080
      - HOST=0.0.0.0
      - APP_URL=${APP_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      
      # Auth — leave JWT_SECRET / ADMIN_PASSWORD blank to have rapibase
      # generate strong values on first boot and persist them (stable
      # across restarts). Setting them to the old example values makes
      # rapibase refuse to start.
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRY=${JWT_EXPIRY:-1h}
      - REFRESH_EXPIRY=${REFRESH_EXPIRY:-7d}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rapibase.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      
      # API Keys
      - ANON_KEY=${ANON_KEY:-}
      - SERVICE_KEY=${SERVICE_KEY:-}
      
      # SMTP (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-RapiBase}
      
      # Auth Redirect
      - AUTH_REDIRECT_URL=${AUTH_REDIRECT_URL:-}
      
      # Storage (MinIO)
      - STORAGE_ENABLED=${STORAGE_ENABLED:-true}
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_USE_SSL=false
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-http://localhost:9000}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck is defined in the Dockerfile — keeping it there as
    # the single source of truth. Add a `healthcheck:` block here only
    # if you need to override intervals or the command per environment.

  db:
    image: postgres:16-alpine
    # Logical replication is required by rapibase realtime
    # (postgres_changes subscriptions stream from the WAL). Defaults
    # for max_wal_senders / max_replication_slots are 10 in PG 13+,
    # set explicitly here so the value is visible at a glance.
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    environment:
      - POSTGRES_USER=rapibase
      - POSTGRES_PASSWORD=rapibase
      - POSTGRES_DB=rapibase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapibase"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # Bound to 127.0.0.1: the MinIO console (9001) is an admin UI that
    # must NEVER be public, and the S3 API (9000) should be served to
    # browsers through rapibase/Caddy (authenticated), not exposed raw.
    # With default minioadmin credentials this binding is what stops the
    # repo-public credentials from being usable from the internet.
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY:-minioadmin}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL:-}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL:-}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
