services:
  rapibase:
    build: .
    expose:
      - "8080"
    environment:
      # Database (uses 'db' service by default, override with DATABASE_URL env var)
      - DATABASE_URL=${DATABASE_URL:-postgres://rapibase:rapibase@db:5432/rapibase?sslmode=disable}
      
      # Server
      - PORT=8080
      - HOST=0.0.0.0
      - APP_URL=${APP_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      
      # Auth
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRY=${JWT_EXPIRY:-1h}
      - REFRESH_EXPIRY=${REFRESH_EXPIRY:-7d}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rapibase.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      
      # API Keys
      - ANON_KEY=${ANON_KEY:-}
      - SERVICE_KEY=${SERVICE_KEY:-}
      
      # SMTP (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-RapiBase}
      
      # Auth Redirect
      - AUTH_REDIRECT_URL=${AUTH_REDIRECT_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=rapibase
      - POSTGRES_PASSWORD=rapibase
      - POSTGRES_DB=rapibase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapibase"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
