# =============================================================================
# RAPIBASE - Docker Compose Configuration
# =============================================================================
# Quick start: docker compose up -d
# Access: http://localhost:8080 (or your server IP)
# =============================================================================

services:
  rapibase:
    build: .
    # Forward EVERY variable from .env into the container — including any
    # added in future updates. Without this, a new setting (e.g.
    # AUTH_SIGNUP_ENABLED) silently falls back to its built-in default just
    # because it isn't listed in `environment:` below, even though it's in
    # .env. `required: false` keeps `docker compose up` working with no
    # .env at all (the ${VAR:-default} values below cover that case). The
    # explicit `environment:` block always takes precedence over env_file.
    env_file:
      - path: .env
        required: false
    # Ports are bound to 127.0.0.1 so ONLY a reverse proxy on the host
    # (Caddy/nginx) can reach them — never the public internet directly.
    # Exposing 8080 to 0.0.0.0 is how an attacker can bypass Caddy and
    # hit the API with no TLS/WAF. If your Caddy runs inside Docker,
    # remove this published port and reach rapibase by its service name.
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      # Database (uses 'db' service by default, override with DATABASE_URL env var)
      - DATABASE_URL=${DATABASE_URL:-postgres://rapibase:rapibase@db:5432/rapibase?sslmode=disable}
      
      # Server
      - PORT=8080
      - HOST=0.0.0.0
      - APP_URL=${APP_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      
      # Auth — leave JWT_SECRET / ADMIN_PASSWORD blank to have rapibase
      # generate strong values on first boot and persist them (stable
      # across restarts). Setting them to the old example values makes
      # rapibase refuse to start.
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRY=${JWT_EXPIRY:-1h}
      - REFRESH_EXPIRY=${REFRESH_EXPIRY:-7d}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rapibase.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      
      # API Keys
      - ANON_KEY=${ANON_KEY:-}
      - SERVICE_KEY=${SERVICE_KEY:-}
      
      # SMTP (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-RapiBase}
      
      # Auth Redirect
      - AUTH_REDIRECT_URL=${AUTH_REDIRECT_URL:-}
      
      # Storage (SeaweedFS, S3-compatible). Files are served by rapibase
      # itself under APP_URL — the storage service is never exposed.
      - STORAGE_ENABLED=${STORAGE_ENABLED:-true}
      - STORAGE_ENDPOINT=storage:8333
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-rapibase}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-rapibase-storage-secret}
      - STORAGE_USE_SSL=false
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck is defined in the Dockerfile — keeping it there as
    # the single source of truth. Add a `healthcheck:` block here only
    # if you need to override intervals or the command per environment.

  db:
    image: postgres:16-alpine
    # Logical replication is required by rapibase realtime
    # (postgres_changes subscriptions stream from the WAL). Defaults
    # for max_wal_senders / max_replication_slots are 10 in PG 13+,
    # set explicitly here so the value is visible at a glance.
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    environment:
      - POSTGRES_USER=rapibase
      - POSTGRES_PASSWORD=rapibase
      - POSTGRES_DB=rapibase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapibase"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  storage:
    # SeaweedFS in single-process mode: S3 API on 8333 for rapibase only.
    # Pinned on purpose — bump deliberately, never "latest".
    image: chrislusf/seaweedfs:4.47
    # No published ports: rapibase reaches it inside this network and
    # serves files to the world itself (public buckets, signed URLs).
    # The admin UI, WebDAV, Iceberg/Lance catalogs and telemetry are off.
    command: >
      mini -dir=/data
      -admin.ui=false -webdav=false
      -s3.port.iceberg=0 -s3.port.lance=0
      -master.telemetry=false
    environment:
      # S3 credentials rapibase signs with.
      - AWS_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY:-rapibase}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_SECRET_KEY:-rapibase-storage-secret}
      # Lock SeaweedFS's internal HTTP APIs (filer, volume) with signed
      # tokens so nothing but its own S3 gateway can read or write files.
      - WEED_JWT_SIGNING_KEY=${STORAGE_SECRET_KEY:-rapibase-storage-secret}
      - WEED_JWT_SIGNING_READ_KEY=${STORAGE_SECRET_KEY:-rapibase-storage-secret}
      - WEED_JWT_FILER_SIGNING_KEY=${STORAGE_SECRET_KEY:-rapibase-storage-secret}
      - WEED_JWT_FILER_SIGNING_READ_KEY=${STORAGE_SECRET_KEY:-rapibase-storage-secret}
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
